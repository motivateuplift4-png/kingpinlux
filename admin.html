<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a1830">
<title>Orders — KINGPIN LUX Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fb;--surface:#fff;--surface-2:#fafbfe;--ink:#0a1830;--ink-2:#33405a;--muted:#6b7896;--muted-2:#9aa6bd;
  --line:#e3e8f1;--line-2:#eef1f7;--blue:#1357d6;--blue-deep:#0c3a96;--blue-tint:#e9f1ff;
  --ok:#1a9e5f;--ok-tint:#e6f7ef;--warn:#b5760a;--warn-tint:#fff4de;--bad:#c0233b;--bad-tint:#fde9ec;
  --serif:'Fraunces',Georgia,serif;--sans:'Manrope',-apple-system,Segoe UI,sans-serif;
  --r:14px;--shadow:0 10px 30px -18px rgba(12,40,96,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink-2);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
h1,h2,h3{font-family:var(--serif);color:var(--ink);font-weight:600;letter-spacing:-.01em}
.crown{width:28px;height:20px;color:var(--blue)}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:34px 28px;width:100%;max-width:380px;box-shadow:var(--shadow);text-align:center}
.lcard .crown{width:40px;height:28px;margin-bottom:10px}
.lcard h1{font-size:26px;margin-bottom:4px}
.lcard p{color:var(--muted);font-size:13px;margin-bottom:22px}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;outline:none;transition:.2s}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(19,87,214,.14)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid transparent;border-radius:999px;padding:10px 18px;font-weight:700;font-size:13px;transition:.2s;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-deep)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-block{width:100%;padding:13px}
.btn[disabled]{opacity:.55;pointer-events:none}
.err{color:var(--bad);font-size:12.5px;font-weight:700;margin-top:12px;min-height:18px}

/* top bar */
.top{background:var(--ink);color:#dfe6f5;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.top .brand{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none}
.top .brand b{font-family:var(--serif);font-size:17px;letter-spacing:.12em}
.top .brand span{font-size:10px;letter-spacing:.2em;color:#9cc0ff;font-weight:800}
.top .brand .crown{color:#9cc0ff}
.top .sp{flex:1}
.top .upd{font-size:11.5px;color:#8fa1c2}
.top .tb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.top .tb:hover{background:rgba(255,255,255,.16)}

/* setup / notices */
.notice{border-radius:var(--r);padding:16px 18px;margin:18px 0;font-size:13.5px;line-height:1.6}
.notice b{color:var(--ink)}
.notice.warn{background:var(--warn-tint);border:1px solid #f0d08a;color:#6d4f0c}
.notice.new{background:var(--blue-tint);border:1px solid #bcd3fb;color:var(--blue-deep);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.notice.new .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(19,87,214,.18)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.stat .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.stat .v{font-family:var(--serif);font-size:27px;color:var(--ink);margin-top:4px;line-height:1.1}
.stat .s{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.stat.hl{border-color:#f0d08a;background:var(--warn-tint)}
.stat.hl2{border-color:#bcd3fb;background:var(--blue-tint)}

.grid{display:grid;grid-template-columns:1fr 310px;gap:18px;align-items:start;padding-bottom:40px}

/* toolbar */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab .c{opacity:.6;margin-left:4px}
.search{flex:1;min-width:180px;border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;background:#fff;outline:none}
.search:focus{border-color:var(--blue)}

/* orders */
.order{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.order.fresh{border-color:var(--blue);box-shadow:0 0 0 3px rgba(19,87,214,.12)}
.oh{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:14px 16px;cursor:pointer;width:100%;text-align:left;background:none;border:none}
.oh .ref{font-weight:800;color:var(--ink);font-size:14px;letter-spacing:.02em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.oh .who{font-size:13px;color:var(--ink-2)}
.oh .when{font-size:12px;color:var(--muted)}
.oh .amt{font-family:var(--serif);font-size:20px;color:var(--ink);text-align:right;line-height:1.1}
.oh .badges{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.b{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.b-unpaid{background:var(--warn-tint);color:var(--warn)}
.b-paid{background:var(--ok-tint);color:var(--ok)}
.b-ship{background:var(--blue-tint);color:var(--blue-deep)}
.b-shipped{background:#eef1f7;color:var(--muted)}
.b-new{background:var(--blue);color:#fff}
.b-bad{background:var(--bad-tint);color:var(--bad)}
.od{border-top:1px solid var(--line-2);padding:14px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sec h4{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:6px}
.sec p,.sec li{font-size:13.5px;color:var(--ink);line-height:1.55}
.sec ul{list-style:none}
.sec a{color:var(--blue);text-decoration:none;font-weight:700}
.sec .mini{font-size:12px;color:var(--muted)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.links .btn{padding:6px 11px;font-size:12px}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tog{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-weight:800;font-size:12.5px;display:inline-flex;gap:7px;align-items:center}
.tog .bx{width:16px;height:16px;border-radius:5px;border:2px solid var(--muted-2);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
.tog.on.paid{border-color:var(--ok);color:var(--ok);background:var(--ok-tint)}
.tog.on.paid .bx{background:var(--ok);border-color:var(--ok)}
.tog.on.ship{border-color:var(--blue);color:var(--blue-deep);background:var(--blue-tint)}
.tog.on.ship .bx{background:var(--blue);border-color:var(--blue)}
.note{grid-column:1/-1}
.note textarea{width:100%;min-height:62px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;resize:vertical;outline:none;font-size:13px}
.note textarea:focus{border-color:var(--blue)}
.note .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.warnline{grid-column:1/-1;background:var(--bad-tint);color:var(--bad);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:700}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{font-size:19px;margin-bottom:6px}

/* news feed */
.feed{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:sticky;top:76px}
.feed h2{font-size:18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.feed h2 .btn{padding:5px 10px;font-size:11px}
.ev{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.ev:last-child{border-bottom:none}
.ev .i{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.ev .i.placed{background:var(--blue-tint);color:var(--blue)}
.ev .i.paid{background:var(--ok-tint);color:var(--ok)}
.ev .i.shipped{background:#eef1f7;color:var(--ink-2)}
.ev .i.undo{background:var(--warn-tint);color:var(--warn)}
.ev .t{font-size:12.5px;color:var(--ink);line-height:1.4}
.ev .t b{font-weight:800}
.ev .w{font-size:11px;color:var(--muted);margin-top:1px}
.ev.unseen .t::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:6px;vertical-align:1px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;font-size:13px;z-index:50;transition:.35s cubic-bezier(.16,1,.3,1);box-shadow:var(--shadow);max-width:calc(100% - 30px);text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}

.top .tb{white-space:nowrap}
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .feed{position:static}
  .feed .ev:nth-child(n+7){display:none}      /* orders come first on a phone; keep the feed short */
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
  .od{grid-template-columns:1fr}
  .top .upd,.top .brand span{display:none}
  .top .wrap{gap:8px}
  .top .tb{padding:7px 11px}
  .stat .v{font-size:23px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="crown" viewBox="0 0 64 44"><path fill="currentColor" d="M4 40h56l-4-22-12 11L32 8 20 29 8 18 4 40z"/></symbol></svg>

<!-- LOGIN -->
<section class="login" id="loginView" hidden>
  <form class="lcard" id="loginForm" autocomplete="on">
    <svg class="crown"><use href="#crown"/></svg>
    <h1>KINGPIN Admin</h1>
    <p>Orders &amp; store activity</p>
    <label class="sr" for="pw" style="position:absolute;left:-9999px">Password</label>
    <input class="in" id="pw" type="password" autocomplete="current-password" placeholder="Admin password" required>
    <button class="btn btn-primary btn-block" id="loginBtn" type="submit" style="margin-top:12px">Log in</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</section>

<!-- DASHBOARD -->
<div id="appView" hidden>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/" target="_blank" rel="noopener"><svg class="crown"><use href="#crown"/></svg><b>KINGPIN</b><span>ADMIN</span></a>
      <div class="sp"></div>
      <span class="upd" id="updated"></span>
      <button class="tb" id="refreshBtn" type="button">↻ Refresh</button>
      <button class="tb" id="logoutBtn" type="button">Log out</button>
    </div>
  </header>

  <main class="wrap">
    <div class="notice warn" id="setupNotice" hidden></div>
    <div class="notice new" id="newNotice" hidden>
      <span class="dot"></span><span id="newText"></span>
      <button class="btn btn-ghost" id="markSeen" type="button" style="margin-left:auto;padding:6px 12px;font-size:12px">Mark all as seen</button>
    </div>

    <section class="stats" id="stats"></section>

    <div class="grid">
      <section>
        <div class="bar">
          <div class="tabs" id="tabs" role="tablist"></div>
          <input class="search" id="search" type="search" placeholder="Search name, reference, email, city…">
        </div>
        <div id="list"></div>
      </section>

      <aside class="feed" aria-label="Store news">
        <h2>What's new <button class="btn btn-ghost" id="alertsBtn" type="button" hidden>🔔 Alerts</button></h2>
        <div id="feed"></div>
      </aside>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const SEEN_KEY="kp_admin_seen";
const POLL_MS=30000;
let orders=[], activity=[], filter="all", query="", open=new Set(), knownRefs=null, seenAt=loadSeen(), timer=null, busy=false;

/* ---------- small helpers ---------- */
function el(tag, props, ...kids){
  const n=document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(v==null||v===false) continue;
    if(k==="class") n.className=v;
    else if(k==="text") n.textContent=v;          // customer data only ever goes in as text
    else if(k.startsWith("on")) n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()) if(c!=null&&c!==false) n.append(c.nodeType?c:document.createTextNode(String(c)));
  return n;
}
const money=n=>"$"+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
function ago(iso){
  const s=Math.max(0,(Date.now()-Date.parse(iso))/1000);
  if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+" min ago";
  if(s<86400) return Math.floor(s/3600)+" h ago"; if(s<86400*7) return Math.floor(s/86400)+" d ago";
  return new Date(iso).toLocaleDateString();
}
const stamp=iso=>new Date(iso).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"});
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2600); }
function loadSeen(){ try{ return localStorage.getItem(SEEN_KEY)||""; }catch(e){ return ""; } }
function saveSeen(iso){ seenAt=iso; try{ localStorage.setItem(SEEN_KEY,iso); }catch(e){} }
const isNew=o=>!seenAt||Date.parse(o.placedAt)>Date.parse(seenAt);

async function api(path, opts={}){
  const r=await fetch(path,{credentials:"same-origin",...opts,
    headers:{...(opts.body?{"Content-Type":"application/json"}:{}),...(opts.headers||{})}});
  let j={}; try{ j=await r.json(); }catch(e){}
  return {status:r.status, ...j};
}

/* ---------- views ---------- */
function showLogin(msg){
  stopPolling();
  $("#appView").hidden=true; $("#loginView").hidden=false;
  $("#loginErr").textContent=msg||"";
  setTimeout(()=>$("#pw").focus(),50);
}
function showApp(){ $("#loginView").hidden=true; $("#appView").hidden=false; }

$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=$("#loginBtn"); btn.disabled=true; $("#loginErr").textContent="";
  try{
    const r=await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("#pw").value})});
    if(r.ok){ $("#pw").value=""; showApp(); await load(true); startPolling(); }
    else $("#loginErr").textContent = r.status===503 ? "Admin password isn't set up on the server yet." : (r.error||"Couldn't log in");
  }catch(err){ $("#loginErr").textContent="Network problem — try again"; }
  btn.disabled=false;
});
$("#logoutBtn").onclick=async()=>{ await api("/api/admin/logout",{method:"POST",body:"{}"}); orders=[]; showLogin(); };
$("#refreshBtn").onclick=()=>load(false,true);
$("#markSeen").onclick=()=>{ saveSeen(new Date().toISOString()); render(); };
$("#search").addEventListener("input",e=>{ query=e.target.value.trim().toLowerCase(); renderList(); });

/* ---------- data ---------- */
async function load(first, manual){
  if(busy) return; busy=true;
  try{
    const r=await api("/api/admin/orders");
    if(r.status===401){ busy=false; return showLogin(first?"":"Session expired — log in again"); }
    if(r.status===503){
      showApp(); orders=[]; activity=[];
      $("#setupNotice").hidden=false;
      $("#setupNotice").replaceChildren(el("b",{text:"Almost ready. "}),
        r.error==="storage not configured"
          ? "Order storage isn't connected yet — orders can't be saved until it is. Follow “Turn on the admin dashboard” in the README."
          : "The admin password isn't set on the server yet.");
      render(); return;
    }
    if(!r.ok) throw new Error(r.error||"load failed");
    $("#setupNotice").hidden=true;

    const fresh = knownRefs ? r.orders.filter(o=>!knownRefs.has(o.ref)) : [];
    orders=r.orders; activity=r.activity||[];
    knownRefs=new Set(orders.map(o=>o.ref));
    if(fresh.length) announce(fresh);
    if(first && !seenAt && !orders.length) saveSeen(new Date().toISOString());
    $("#updated").textContent="Updated "+new Date().toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
    render();
    if(manual && !fresh.length) toast("Up to date");   // don't bury a new-order alert
  }catch(err){
    console.error(err); toast("Couldn't refresh — will retry");
  }finally{ busy=false; }
}
function startPolling(){ stopPolling(); timer=setInterval(()=>{ if(!document.hidden) load(); },POLL_MS); }
function stopPolling(){ if(timer) clearInterval(timer); timer=null; }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && !$("#appView").hidden) load(); });

/* ---------- new order alerts ---------- */
function announce(fresh){
  const total=fresh.reduce((s,o)=>s+o.total,0);
  toast(fresh.length===1 ? `New order ${fresh[0].ref} · ${money(total)}` : `${fresh.length} new orders · ${money(total)}`);
  chime();
  if("Notification" in window && Notification.permission==="granted"){
    try{ new Notification("KINGPIN — new order",{body:fresh.map(o=>`${o.ref} · ${money(o.total)} · ${o.customer.firstName}`).join("\n")}); }catch(e){}
  }
}
function chime(){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx=chime.ctx||(chime.ctx=new C()), t=ctx.currentTime;
    [880,1318.5].forEach((f,i)=>{ const o=ctx.createOscillator(), g=ctx.createGain();
      o.frequency.value=f; o.type="sine"; g.gain.setValueAtTime(0.0001,t+i*.12);
      g.gain.exponentialRampToValueAtTime(0.18,t+i*.12+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+i*.12+.35);
      o.connect(g).connect(ctx.destination); o.start(t+i*.12); o.stop(t+i*.12+.4); });
  }catch(e){}
}
if("Notification" in window && Notification.permission==="default"){
  $("#alertsBtn").hidden=false;
  $("#alertsBtn").onclick=async()=>{ const p=await Notification.requestPermission(); $("#alertsBtn").hidden=true;
    toast(p==="granted"?"Alerts on while this page is open":"Alerts blocked"); chime(); };
}

/* ---------- render ---------- */
const views={
  all:     {label:"All",              test:()=>true},
  unpaid:  {label:"Awaiting payment", test:o=>!o.status.paid},
  toship:  {label:"To ship",          test:o=>o.status.paid&&!o.status.shipped},
  shipped: {label:"Shipped",          test:o=>o.status.shipped},
};

function render(){ renderNew(); renderStats(); renderTabs(); renderList(); renderFeed(); }

function renderNew(){
  const n=orders.filter(isNew).length;
  $("#newNotice").hidden=!n;
  if(n){
    const total=orders.filter(isNew).reduce((s,o)=>s+o.total,0);
    $("#newText").textContent=`${n} new order${n>1?"s":""} since your last visit · ${money(total)}`;
  }
  document.title=(n?`(${n}) `:"")+"Orders — KINGPIN LUX Admin";
}

function renderStats(){
  const today=new Date().toDateString();
  const todays=orders.filter(o=>new Date(o.placedAt).toDateString()===today);
  const unpaid=orders.filter(o=>!o.status.paid), toship=orders.filter(o=>o.status.paid&&!o.status.shipped);
  const paidSum=orders.filter(o=>o.status.paid).reduce((s,o)=>s+o.total,0);
  const card=(k,v,s,cls)=>el("div",{class:"stat "+(cls||"")},el("div",{class:"k",text:k}),el("div",{class:"v",text:v}),el("div",{class:"s",text:s}));
  $("#stats").replaceChildren(
    card("Today", String(todays.length), money(todays.reduce((s,o)=>s+o.total,0))+" ordered"),
    card("Awaiting payment", String(unpaid.length), money(unpaid.reduce((s,o)=>s+o.total,0))+" expected", unpaid.length?"hl":""),
    card("To ship", String(toship.length), toship.length?"paid, not sent yet":"nothing waiting", toship.length?"hl2":""),
    card("Received", money(paidSum), (n=>`${n} paid order${n===1?"":"s"}`)(orders.filter(o=>o.status.paid).length)),
  );
}

function renderTabs(){
  $("#tabs").replaceChildren(...Object.entries(views).map(([k,v])=>
    el("button",{class:"tab"+(filter===k?" on":""),type:"button",role:"tab","aria-selected":String(filter===k),
      onclick:()=>{filter=k;renderTabs();renderList();}},
      v.label, el("span",{class:"c",text:String(orders.filter(v.test).length)}))));
}

function matches(o){
  if(!query) return true;
  const c=o.customer, s=o.shipping;
  return [o.ref,c.firstName,c.lastName,c.email,c.phone,s.address1,s.address2,s.city,s.state,s.country,s.zip,o.note,...o.items.map(i=>i.name)]
    .join(" ").toLowerCase().includes(query);
}

function renderList(){
  const list=orders.filter(views[filter].test).filter(matches);
  if(!orders.length){
    $("#list").replaceChildren(el("div",{class:"empty"},el("h3",{text:"No orders yet"}),
      el("p",{text:"New orders show up here automatically. Keep this page open to get an alert."})));
    return;
  }
  if(!list.length){ $("#list").replaceChildren(el("div",{class:"empty"},el("p",{text:"Nothing matches."}))); return; }
  $("#list").replaceChildren(...list.map(orderCard));
}

function orderCard(o){
  const c=o.customer, s=o.shipping, isOpen=open.has(o.ref);
  const badges=[];
  if(isNew(o)) badges.push(el("span",{class:"b b-new",text:"New"}));
  if(o.amountCheck==="mismatch") badges.push(el("span",{class:"b b-bad",text:"Check amount"}));
  if(o.status.shipped && !o.status.paid) badges.push(el("span",{class:"b b-bad",text:"Shipped · not paid"}));
  else badges.push(o.status.shipped ? el("span",{class:"b b-shipped",text:"Shipped"})
    : o.status.paid ? el("span",{class:"b b-ship",text:"To ship"})
    : el("span",{class:"b b-unpaid",text:"Awaiting payment"}));

  const head=el("button",{class:"oh",type:"button","aria-expanded":String(isOpen),
      onclick:()=>{ isOpen?open.delete(o.ref):open.add(o.ref); renderList(); }},
    el("div",null,
      el("div",{class:"ref"},o.ref),
      el("div",{class:"who",text:`${c.firstName} ${c.lastName} · ${s.city}, ${s.country}`}),
      el("div",{class:"when",text:`${ago(o.placedAt)} · ${o.items.reduce((n,i)=>n+i.qty,0)} item${o.items.reduce((n,i)=>n+i.qty,0)>1?"s":""}`})),
    el("div",null, el("div",{class:"amt",text:money(o.total)}), el("div",{class:"badges"},badges)));

  const card=el("article",{class:"order"+(isNew(o)?" fresh":"")},head);
  if(!isOpen) return card;

  const addr=[s.address1,s.address2,[s.city,s.state,s.zip].filter(Boolean).join(" "),s.country].filter(Boolean);
  const digits=c.phone.replace(/[^\d+]/g,"");
  const detail=el("div",{class:"od"},
    o.amountCheck==="mismatch" ? el("div",{class:"warnline",
      text:`The customer's page showed ${money(o.claimedTotal)}, but your prices come to ${money(o.total)}. Only ship once ${money(o.total)} has arrived.`}) : null,
    el("div",{class:"sec"},
      el("h4",{text:"Items"}),
      el("ul",null,o.items.map(i=>el("li",{text:`${i.qty} × ${i.name}`}))),
      el("p",{class:"mini",text:`Subtotal ${money(o.subtotal)}${o.discount?` · ${o.discountCode} −${money(o.discount)}`:""} · Total ${money(o.total)} ${o.currency}`}),
      el("h4",{text:"Placed",style:"margin-top:12px"}),
      el("p",{text:stamp(o.placedAt)}),
      o.status.paidAt ? el("p",{class:"mini",text:"Paid "+stamp(o.status.paidAt)}) : null,
      o.status.shippedAt ? el("p",{class:"mini",text:"Shipped "+stamp(o.status.shippedAt)}) : null),
    el("div",{class:"sec"},
      el("h4",{text:"Ship to"}),
      ...addr.map(line=>el("p",{text:line})),
      el("p",{style:"margin-top:6px",text:`${c.firstName} ${c.lastName}`}),
      el("div",{class:"links"},
        el("a",{class:"btn btn-ghost",href:"mailto:"+encodeURIComponent(c.email).replace(/%40/g,"@")+"?subject="+encodeURIComponent("Your KINGPIN LUX order "+o.ref)},"✉ Email"),
        digits ? el("a",{class:"btn btn-ghost",href:"tel:"+digits},"☎ Call") : null,
        digits ? el("a",{class:"btn btn-ghost",href:"https://wa.me/"+digits.replace(/^\+/,""),target:"_blank",rel:"noopener"},"WhatsApp") : null,
        el("button",{class:"btn btn-ghost",type:"button",onclick:()=>copy([`${c.firstName} ${c.lastName}`,...addr,c.phone].join("\n"),"Address copied")},"Copy address")),
      el("p",{class:"mini",style:"margin-top:8px",text:`${c.email} · ${c.phone}${c.optin?" · wants marketing":""}`})),
    el("div",{class:"acts"},
      toggle("paid","Paid",o.status.paid,o),
      toggle("ship","Shipped",o.status.shipped,o)),
    noteBox(o));
  card.append(detail);
  return card;
}

function toggle(kind,label,on,o){
  return el("button",{class:`tog ${kind}${on?" on":""}`,type:"button","aria-pressed":String(on),
    onclick:()=>update(o.ref, kind==="paid"?{paid:!on}:{shipped:!on}, `${o.ref} marked ${on?"not ":""}${label.toLowerCase()}`)},
    el("span",{class:"bx",text:on?"✓":""}), label);
}

function noteBox(o){
  const ta=el("textarea",{placeholder:"Private note — tracking number, what the customer asked…",maxlength:"1000"});
  ta.value=o.note||"";
  const btn=el("button",{class:"btn btn-ghost",type:"button",onclick:()=>update(o.ref,{note:ta.value},"Note saved")},"Save note");
  return el("div",{class:"note sec"},el("h4",{text:"Note"}),ta,el("div",{class:"row"},el("span",{class:"mini",text:"Only you can see this"}),btn));
}

async function update(ref, patch, okMsg){
  const i=orders.findIndex(o=>o.ref===ref); if(i<0) return;
  const r=await api("/api/admin/update",{method:"POST",body:JSON.stringify({ref,...patch})});
  if(r.status===401) return showLogin("Session expired — log in again");
  if(!r.ok) return toast("Couldn't save — "+(r.error||"try again"));
  orders[i]=r.order; toast(okMsg);
  load();                                           // pull the new activity entry
  render();
}

function copy(text,msg){
  (navigator.clipboard&&navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(()=>toast(msg),()=>{ window.prompt("Copy:",text); });
}

function renderFeed(){
  if(!activity.length){ $("#feed").replaceChildren(el("p",{class:"mini",style:"color:var(--muted);font-size:12.5px",text:"Orders, payments and shipments will appear here as they happen."})); return; }
  const icon={placed:"＋",paid:"$",shipped:"➜",unpaid:"↺",unshipped:"↺"};
  const words={placed:"New order",paid:"Marked paid",shipped:"Marked shipped",unpaid:"Marked unpaid",unshipped:"Marked not shipped"};
  $("#feed").replaceChildren(...activity.map(ev=>{
    const cls = ev.type==="placed"?"placed":ev.type==="paid"?"paid":ev.type==="shipped"?"shipped":"undo";
    const unseen = ev.type==="placed" && (!seenAt || Date.parse(ev.t)>Date.parse(seenAt));
    return el("div",{class:"ev"+(unseen?" unseen":"")},
      el("div",{class:"i "+cls,text:icon[ev.type]||"•"}),
      el("div",null,
        el("div",{class:"t"}, el("b",{text:words[ev.type]||ev.type})," ",ev.ref," · ",money(ev.total),ev.name?" · "+ev.name:""),
        el("div",{class:"w",text:ago(ev.t)})));
  }));
}

/* ---------- boot ---------- */
setInterval(()=>{ if(!$("#appView").hidden){ renderList(); renderFeed(); } },60000);   // keep "x min ago" fresh
(async()=>{
  const r=await api("/api/admin/orders").catch(()=>({status:0}));
  if(r.status===401) return showLogin();
  if(r.status===503 && r.error==="admin password not set"){ showLogin(); $("#loginErr").textContent="Admin password isn't set up on the server yet."; return; }
  showApp(); await load(true); startPolling();
})();
})();
</script>
</body>
</html>
