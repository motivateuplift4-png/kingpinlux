<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KINGPIN LUX</title>
<meta name="description" content="Iced-out watch hand-set with VVS moissanite. Complimentary insured worldwide shipping, lifetime warranty and 30-day returns.">
<meta name="theme-color" content="#0b0a09">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0a09'/%3E%3Cpath fill='%23c9a86a' d='M8 46h48l-3.5-19-10.5 9.5L32 18 22 36.5 11.5 27 8 46z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.pdp{display:grid;grid-template-columns:1.12fr 1fr;gap:clamp(36px,6vw,96px);align-items:start;padding-top:28px;padding-bottom:clamp(80px,10vw,120px)}
.crumbs-row{padding-top:28px}
.crumbs-row .crumbs{margin:0}

/* gallery */
.gal{position:sticky;top:calc(var(--hd) + 24px)}
.pstage{position:relative;aspect-ratio:4/5;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;
  background:var(--tile)}
.pstage .slide{position:absolute;inset:0;opacity:0;transition:opacity .7s var(--ease)}
.pstage .slide.on{opacity:1}
.pstage .zoom{position:absolute;inset:0;transition:transform .5s var(--ease-out)}
.pstage .zoom img{width:100%;height:100%;object-fit:cover}
.pstage.zooming .zoom{transform:scale(2)}
.pstage .hint{position:absolute;right:16px;bottom:16px;z-index:2;display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);background:rgba(255,255,255,.88);padding:8px 12px;border:1px solid var(--line);pointer-events:none;transition:opacity .3s}
.pstage .hint svg{width:13px;height:13px;color:var(--accent)}
.pstage.zooming .hint{opacity:0}
.pstage .nav-btn{position:absolute;top:50%;z-index:3;width:46px;height:46px;margin-top:-23px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.92);border:1px solid var(--line-2);color:var(--text);transition:border-color .3s,color .3s}
.pstage .nav-btn:hover{border-color:var(--text)}
.pstage .nav-btn svg{width:18px;height:18px}
.pstage .prev{left:14px}.pstage .next{right:14px}
.thumbs{display:flex;gap:10px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.thumbs button{position:relative;flex:0 0 84px;height:100px;border:1px solid var(--line);overflow:hidden;opacity:.55;transition:opacity .3s,border-color .3s;
  background:var(--tile)}
.thumbs button.on,.thumbs button:hover{opacity:1;border-color:var(--text)}
.thumbs img{width:100%;height:100%;object-fit:cover}

/* buy box */
.buy h1{font-size:clamp(32px,3.4vw,50px);margin:12px 0 16px;line-height:.98}
.price{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.promo-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--text-2)}
.promo-line b{color:var(--accent)}
.finish{margin-top:24px;padding:22px 0 24px;border-block:1px solid var(--line)}
.finish > span{display:block;font:700 11.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.finish > span b{color:var(--text)}
.finish .sws{gap:12px}
.finish .sw{width:34px;height:34px}
.finish .sw::after{inset:-5px}
.price b{font:800 32px/1 var(--sans);color:var(--text)}
.price small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.desc{margin:26px 0 24px;font-size:15.5px;line-height:1.8;color:var(--text-2)}
.specs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line);margin-bottom:28px}
.specs div{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.specs dt{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.specs dd{font-size:14px;color:var(--text)}
.specs div:last-child:nth-child(odd){grid-column:1/-1}
.actions{display:flex;gap:12px;margin-bottom:12px}
.actions .qty{margin:0}
.actions .btn{flex:1}
.held{display:flex;align-items:center;gap:10px;margin:18px 0 0;font-size:13px;color:var(--text-2)}
.held svg{width:16px;height:16px;color:var(--accent);flex-shrink:0}
.alist{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin:28px 0;padding:24px 0;border-block:1px solid var(--line)}
.alist li{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;color:var(--text-2);line-height:1.5}
.alist svg{width:20px;height:20px;color:var(--accent);flex-shrink:0}
.paybox{display:flex;gap:16px;padding:22px;background:var(--surface);border:1px solid var(--line-2);margin-bottom:30px}
.paybox > svg{width:28px;height:28px;color:var(--accent);flex-shrink:0}
.paybox b{display:block;font:800 14px/1.25 var(--display);font-stretch:110%;text-transform:uppercase;color:var(--text);margin-bottom:6px}
.paybox p{font-size:13.5px;color:var(--muted);line-height:1.7}
.paybox a{color:var(--text);font-weight:600;border-bottom:1px solid var(--line-3)}
.ask{margin-top:30px;padding:24px;border:1px solid var(--line);background:var(--surface)}
.ask p{font:800 16px/1.3 var(--display);font-stretch:110%;text-transform:uppercase;color:var(--text);margin-bottom:14px}

/* sticky buy bar */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.97);box-shadow:0 -14px 40px -24px rgba(0,0,0,.4);
  border-top:1px solid var(--line-2);transform:translateY(105%);transition:transform .5s var(--ease-out)}
.sticky.on{transform:none}
.sticky .wrap{display:flex;align-items:center;gap:18px;height:78px}
.sticky .th{position:relative;width:48px;height:58px;flex-shrink:0;overflow:hidden;background:var(--tile)}
.sticky .th img{width:100%;height:100%;object-fit:cover}
.sticky .nm{flex:1;min-width:0}
.sticky .nm b{display:block;font:700 15px/1.25 var(--sans);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sticky .nm span{font-size:13px;color:var(--muted)}
.sticky .btn{height:50px}

.ft{padding-bottom:78px}
.held b{color:var(--text)}
.wa-btn{margin-top:10px}
.wa-btn svg{color:#25d366}
.so-note{margin-top:14px;padding:14px 16px;border-left:3px solid var(--text);background:var(--surface);font-size:14px;color:var(--text-2);line-height:1.6}
.so-note b{color:var(--text)}
.prate{display:inline-flex;align-items:center;gap:10px;margin:-6px 0 16px;font-size:13px;font-weight:600;color:var(--text-2)}
.prate:hover{color:var(--text)}
.eta{display:flex;gap:14px;align-items:flex-start;margin-top:14px;padding:16px 18px;background:var(--surface);border:1px solid var(--line)}
.eta svg{width:22px;height:22px;color:var(--accent);flex-shrink:0;margin-top:1px}
.eta b{display:block;font-size:14.5px;color:var(--text)}
.eta span{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.55}
.inbox{margin:0 0 28px}
.inbox h4{font:700 11.5px/1 var(--sans);font-stretch:100%;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.inbox ul{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.inbox li{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 8px;background:var(--surface);border:1px solid var(--line);
  text-align:center;font-size:12.5px;font-weight:600;color:var(--text);line-height:1.35}
.inbox svg{width:24px;height:24px;color:var(--accent)}
.notfound{text-align:center;padding:120px 0}
.notfound h1{font-size:44px;margin-bottom:14px}
.notfound p{color:var(--muted);margin-bottom:28px}

@media (max-width:900px){
  .pdp{grid-template-columns:1fr;padding-top:16px}
  .gal{position:static}
  .alist{grid-template-columns:1fr}
  .sticky .wrap{height:70px;gap:12px}
  .sticky .th{display:none}
  .sticky .nm b{font-size:16px}
}
@media (max-width:560px){
  .crumbs-row{padding-top:14px}
  .pdp{gap:22px}
  .thumbs button{flex-basis:64px;height:76px}
  .buy h1{font-size:clamp(28px,8vw,36px);margin:8px 0 12px}
  .price b{font-size:28px}
  .finish{margin-top:18px;padding:16px 0 18px}
  .finish .sw{width:30px;height:30px}
  .desc{font-size:14.5px;margin:18px 0}
  .specs{grid-template-columns:1fr 1fr}
  .specs div{padding:11px 12px}
  .specs dd{font-size:13px}
  .actions .btn{padding:0 14px}
  .alist{gap:12px;margin:22px 0;padding:18px 0}
  .alist li{font-size:13px}
  .paybox{padding:18px}
  .inbox li{padding:14px 6px;font-size:12px}
  .sticky .btn{padding:0 18px}
  .actions .qty.lg button{width:40px}
  .inbox ul{grid-template-columns:1fr 1fr}
}
</style>
<script src="assets/catalog.js"></script>
<script src="/api/catalog"></script>
<script src="assets/site.js"></script>
</head>
<body>
<script>KP.header("shop")</script>

<main id="main">
  <div class="wrap crumbs-row"><nav class="crumbs" aria-label="Breadcrumb" id="crumbs"></nav></div>

  <section class="wrap pdp" id="pdp">
    <div class="gal">
      <div class="pstage" id="stage" aria-label="Product images"></div>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="buy">
      <span class="eyebrow" id="pColl"></span>
      <h1 id="pName"></h1>
      <a class="prate" id="pRate" href="#pReviews" hidden></a>
      <div class="price"><b id="pPrice"></b><small>USD &middot; Free insured shipping</small></div>
      <p class="promo-line" id="pPromo" hidden></p>
      <div class="finish" id="pFinish"><span>Finish: <b id="pFin"></b></span><div id="pSw"></div></div>
      <p class="desc" id="pDesc"></p>
      <dl class="specs" id="pSpecs"></dl>

      <div class="actions">
        <div class="qty lg" id="pQty">
          <button type="button" data-q="-1" aria-label="One less"></button><span id="pQn">1</span><button type="button" data-q="1" aria-label="One more"></button>
        </div>
        <button class="btn btn-gold" type="button" id="pAdd">Add to bag</button>
      </div>
      <button class="btn btn-dark btn-block" type="button" id="pBuy">Buy now &middot; Pay by bank transfer</button>
      <a class="btn btn-line btn-block wa-btn" id="pWa" target="_blank" rel="noopener" hidden></a>
      <div class="so-note" id="pSold" hidden></div>
      <p class="held" id="held"></p>
      <div class="eta" id="eta"></div>

      <ul class="alist" id="alist"></ul>

      <div class="inbox"><h4>In the box</h4><ul id="inbox"></ul></div>

      <div class="paybox" id="paybox"></div>

      <div class="acc sm" id="pAcc"></div>

      <div class="ask" data-if-contact hidden><p>Questions about this piece?</p><div class="contacts" data-contacts="btn-sm"></div></div>
    </div>
  </section>

  <section class="sec alt" id="related">
    <div class="wrap">
      <div class="shead"><div><span class="eyebrow">You may also like</span><h2>From the collection</h2></div><a class="link" href="shop.html" id="relLink"></a></div>
      <div class="grid" id="relGrid"></div>
    </div>
  </section>

  <section class="sec" id="pReviews" hidden>
    <div class="wrap">
      <div class="shead"><div><span class="eyebrow">Reviews</span><h2>From our clients</h2></div><div class="revsum" id="pRevSum"></div></div>
      <div class="revs" id="pRevList"></div>
    </div>
  </section>

  <section class="sec tight" id="recent" hidden>
    <div class="wrap">
      <div class="shead"><div><span class="eyebrow">Your history</span><h2>Recently viewed</h2></div></div>
      <div class="grid" id="recentGrid"></div>
    </div>
  </section>
</main>

<div class="sticky" id="sticky" aria-hidden="true">
  <div class="wrap">
    <div class="th" id="sThumb"></div>
    <div class="nm"><b id="sName"></b><span id="sPrice"></span></div>
    <button class="btn btn-gold" type="button" id="sAdd">Add to bag</button>
  </div>
</div>

<script>KP.footer()</script>
<script>
(function(){
var $=KP.$, $$=KP.$$, I=KP.icon;
var id=new URLSearchParams(location.search).get("id");
var P=KP.prod(id);

if(!P||P.status==="hidden"){
  document.title="Watch not found | KINGPIN LUX";
  $("#main").innerHTML='<section class="wrap notfound"><span class="eyebrow">Not found</span><h1>This watch isn\'t here</h1><p>It may have moved. Browse the full collection instead.</p><a class="btn btn-gold" href="shop.html">View all watches</a></section>';
  $("#sticky").remove();
  return;
}

var C=KP.coll(P.coll)||{}, qn=1, gi=0;
var photos=(P.images&&P.images.length)?P.images:null;
// until photos exist: front, angled and dial close-up views of the illustration
var VIEWS=[{scale:1.22,sparkles:10},{tilt:-18,scale:1.36,sparkles:8,vb:"10 -30 380 475"},{vb:"112 90 176 220",sparkles:6}];
var imgs=photos||VIEWS;

/* meta */
document.title=P.name+" | KINGPIN LUX";
var md=document.querySelector('meta[name="description"]'); if(md) md.setAttribute("content",(P.name+". "+P.desc).slice(0,158));
var ld={"@context":"https://schema.org","@type":"Product","name":P.name,"description":P.desc,"brand":{"@type":"Brand","name":"KINGPIN LUX"},
  "category":"Watches","sku":"KPL-"+P.id,
  "offers":{"@type":"Offer","price":String(P.price),"priceCurrency":"USD","availability":P.soldOut?"https://schema.org/SoldOut":"https://schema.org/InStock","url":location.origin+"/product.html?id="+P.id}};
if(P.images&&P.images.length) ld.image=P.images.map(function(s){return new URL(s,location.href).href});
var s=document.createElement("script"); s.type="application/ld+json"; s.textContent=JSON.stringify(ld); document.head.appendChild(s);

/* text */
$("#crumbs").innerHTML='<a href="index.html">Home</a><i></i><a href="shop.html">Watches</a><i></i><a href="shop.html?c='+P.coll+'">'+KP.esc(C.name)+"</a><i></i><span>"+KP.esc(P.name)+"</span>";
$("#pColl").textContent=C.label+" · "+P.finishName;
$("#pName").textContent=P.name;
$("#pPrice").textContent=KP.money(P.price);
if(KP.promo){ var pl=$("#pPromo"); pl.hidden=false;
  pl.innerHTML="<b>"+KP.money(KP.promoPrice(P.price))+"</b> with code <button class=\"code\" type=\"button\" data-code=\""+KP.esc(KP.promo.code)+"\">"+KP.esc(KP.promo.code)+"</button> at checkout"; }
$("#pFin").textContent=P.finishName;
var sw=KP.swatches(P,true);
$("#pSw").innerHTML=sw||'<span class="muted" style="font-size:14px">Available in '+KP.esc(P.finishName)+" only</span>";
$("#pDesc").textContent=P.desc;
$("#pSpecs").innerHTML=P.specs.map(function(r){return "<div><dt>"+r[0]+"</dt><dd>"+KP.esc(r[1])+"</dd></div>"}).join("");
$("#pQty").children[0].innerHTML=I.minus; $("#pQty").children[2].innerHTML=I.plus;
var E=KP.eta();
$("#held").innerHTML=I.clock+"<span>Order now and it's held for you until <b>"+E.hold+"</b> while your transfer arrives.</span>";
// transfer 1-3 business days + dispatch within 1 + transit 3-6 = 5 to 10 business days
$("#eta").innerHTML=I.truck+"<div><b>Estimated delivery: "+E.from+" – "+E.to+"</b><span>Depends on when your transfer arrives (usually 1–3 business days). We ship within 24 hours of it landing, insured and tracked.</span></div>";
$("#alist").innerHTML=[
  [I.globe,"Complimentary insured express shipping, worldwide"],
  [I.shield,"Lifetime warranty on setting and movement"],
  [I.returns,"30-day returns in original condition"],
  [I.box,"Signature box and certificate of authenticity"]
].map(function(a){return "<li>"+a[0]+"<span>"+a[1]+"</span></li>"}).join("");
$("#inbox").innerHTML=[[I.watch,"Your watch"],[I.box,"Signature KINGPIN box"],[I.cert,"Certificate of authenticity"],[I.shield,"Lifetime warranty card"]]
  .map(function(a){return "<li>"+a[0]+"<span>"+a[1]+"</span></li>"}).join("");
$("#paybox").innerHTML=I.bank+'<div><b>Paying by bank transfer</b><p>Nothing is charged when you order. You\'ll get our bank details and a unique reference straight away, send the transfer from your own bank, and we ship within 24 hours of it arriving. <a href="info.html#payment">Read more</a></p></div>';
$("#pAcc").innerHTML=[
  ["The details","Hand-set VVS moissanite across the bezel, case and bracelet. "+P.specs.map(function(r){return r[0]+": "+r[1]}).join(". ")+"."],
  ["Shipping & delivery","Every order ships complimentary, fully insured and tracked. Pieces leave us within 24 hours of your transfer clearing and usually arrive in 3–6 business days. Your tracking link is emailed the moment it ships."],
  ["Returns","Return within 30 days in its original condition, with the box and certificate. The refund goes back to the account you paid from, usually within 5 business days of the watch reaching us."],
  ["Lifetime warranty","Covers stone setting and movement for as long as you own the piece. If a stone loosens or the movement needs attention, we repair or replace it. Accidental damage and normal wear to the finish are not covered."]
].map(function(a){return "<details><summary>"+KP.esc(a[0])+'<i></i></summary><div class="bd"><p>'+KP.esc(a[1])+"</p></div></details>"}).join("");

/* gallery */
var stage=$("#stage");
stage.innerHTML=imgs.map(function(v,i){
  var inner=photos?'<img src="'+KP.esc(v)+'" alt="'+KP.esc(P.name)+" — view "+(i+1)+'"'+(i?' loading="lazy"':' fetchpriority="high"')+">"
                  :KP.art(P,v);
  return '<div class="slide'+(i?"":" on")+'"><div class="zoom">'+inner+"</div></div>";
}).join("")+'<div class="hint">'+I.search+"<span>Hover to zoom</span></div>"+
  (imgs.length>1?'<button class="nav-btn prev" type="button" aria-label="Previous image">'+I.back+'</button><button class="nav-btn next" type="button" aria-label="Next image">'+I.arrow+"</button>":"");
$("#thumbs").innerHTML=imgs.length>1?imgs.map(function(v,i){
  return '<button type="button" data-g="'+i+'" class="'+(i?"":"on")+'" aria-label="View '+(i+1)+'">'+
    (photos?'<img src="'+KP.esc(v)+'" alt="" loading="lazy">':KP.art(P,Object.assign({},v,{sparkles:0})))+"</button>"}).join(""):"";
function show(n){
  gi=(n+imgs.length)%imgs.length;
  $$("#stage .slide").forEach(function(s,i){s.classList.toggle("on",i===gi)});
  $$("#thumbs button").forEach(function(b,i){b.classList.toggle("on",i===gi)});
}
$("#thumbs").addEventListener("click",function(e){var b=e.target.closest("[data-g]");if(b)show(+b.dataset.g)});
stage.addEventListener("click",function(e){
  if(e.target.closest(".prev")) return show(gi-1);
  if(e.target.closest(".next")) return show(gi+1);
});
var canHover=matchMedia("(hover:hover)").matches;
if(canHover){
  stage.addEventListener("mousemove",function(e){
    var r=stage.getBoundingClientRect(), z=$$("#stage .slide")[gi].querySelector(".zoom");
    z.style.transformOrigin=((e.clientX-r.left)/r.width*100).toFixed(1)+"% "+((e.clientY-r.top)/r.height*100).toFixed(1)+"%";
    stage.classList.add("zooming");
  });
  stage.addEventListener("mouseleave",function(){stage.classList.remove("zooming")});
}else{
  $(".hint span",stage).textContent=imgs.length>1?"Swipe for more views":"";
  if(imgs.length<2) $(".hint",stage).remove();
  stage.style.cursor="default";
  // swipe between photos
  var x0=null;
  stage.addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
  stage.addEventListener("touchend",function(e){if(x0==null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)show(gi+(dx<0?1:-1));x0=null});
}

/* WhatsApp: order or ask about this exact piece */
var waNum=String((KP.config.contact||{}).whatsapp||"").replace(/\D/g,"");
if(waNum){
  var wa=$("#pWa"); wa.hidden=false; wa.innerHTML=I.whatsapp+"Order or ask on WhatsApp";
  wa.href="https://wa.me/"+waNum+"?text="+encodeURIComponent("Hello KINGPIN LUX, I'm interested in the "+P.name+" ("+KP.money(P.price)+"): "+location.href);
}

/* sold out */
if(P.soldOut){
  ["#pAdd","#sAdd"].forEach(function(s){ var b=$(s); b.disabled=true; b.textContent="Sold out"; });
  ["#pBuy","#held","#eta","#pPromo"].forEach(function(s){ $(s).hidden=true; });
  var so=$("#pSold"); so.hidden=false;
  so.innerHTML="<b>This piece is sold out.</b> "+(waNum||KP.contacts().length?"Message us and we'll tell you when the next one is ready.":"Have a look at the rest of the "+KP.esc(C.name)+" collection below.");
}

/* reviews: this piece first, then the rest */
(function(){
  var all=KP.reviews(); if(!all.length) return;
  var mine=all.filter(function(r){return r.productId===P.id});
  var list=mine.concat(all.filter(function(r){return r.productId!==P.id})).slice(0,6);
  var sum=KP.reviewSummary(all);
  $("#pReviews").hidden=false;
  $("#pRevSum").innerHTML="<b>"+sum.avg.toFixed(1)+"</b><div>"+KP.stars(sum.avg)+"<br><small>"+sum.count+(sum.count===1?" review":" reviews")+"</small></div>";
  $("#pRevList").innerHTML=list.map(KP.reviewCard).join("");
  if(mine.length){
    var ms=KP.reviewSummary(mine), r=$("#pRate"); r.hidden=false;
    r.innerHTML=KP.stars(ms.avg)+"<span>"+ms.avg.toFixed(1)+" &middot; "+ms.count+(ms.count===1?" review":" reviews")+"</span>";
  }
})();

/* buying */
$("#pQty").addEventListener("click",function(e){
  var b=e.target.closest("[data-q]"); if(!b) return;
  qn=Math.max(1,Math.min(20,qn+(+b.dataset.q))); $("#pQn").textContent=qn;
});
function addToBag(){ KP.cart.add(P.id,qn); setTimeout(function(){KP.open("cart")},KP.reduce?0:120); }
$("#pAdd").addEventListener("click",addToBag);
$("#sAdd").addEventListener("click",addToBag);
$("#pBuy").addEventListener("click",function(){ KP.cart.add(P.id,qn); location.href="checkout.html"; });

/* sticky bar whenever the main button is off screen (above or below) */
$("#sThumb").innerHTML=KP.media(P,{sparkles:0,scale:1.2});
$("#sName").textContent=P.name; $("#sPrice").textContent=KP.money(P.price)+" · Free insured shipping";
var sticky=$("#sticky");
if("IntersectionObserver" in window){
  new IntersectionObserver(function(es){
    var e=es[0], past=!e.isIntersecting;
    sticky.classList.toggle("on",past); sticky.setAttribute("aria-hidden",!past);
  }).observe($("#pAdd"));
}

/* related */
var rel=KP.products.filter(function(p){return p.id!==P.id&&p.coll===P.coll});
rel=rel.concat(KP.products.filter(function(p){return p.id!==P.id&&p.coll!==P.coll&&p.tags.indexOf("best")>-1})).slice(0,4);
$("#relGrid").innerHTML=rel.map(KP.card).join("");
$("#relLink").innerHTML="View the "+KP.esc(C.name)+" collection "+I.arrow;
$("#relLink").href="shop.html?c="+P.coll;

/* recently viewed (kept in this browser only) */
var RK="kp_recent", rec=[];
try{ rec=JSON.parse(localStorage.getItem(RK)||"[]"); }catch(e){}
if(!Array.isArray(rec)) rec=[];
var seenP=rec.filter(function(x){return x!==P.id}).map(KP.prod).filter(Boolean).slice(0,4);
if(seenP.length){ $("#recent").hidden=false; $("#recentGrid").innerHTML=seenP.map(KP.card).join(""); }
rec=[P.id].concat(rec.filter(function(x){return x!==P.id})).slice(0,12);
try{ localStorage.setItem(RK,JSON.stringify(rec)); }catch(e){}
KP.reveal();
})();
</script>
</body>
</html>
